rk,var(--pulse-primary-wash,#1a1e2a))}}:where(.dark,[data-theme=dark]) .dvh-root{--pa-ink:var(--pulse-ink-dark,var(--pulse-ink,#eef0f5));--pa-muted:var(--pulse-muted-dark,var(--pulse-muted,#a3a9b8));--pa-card:var(--pulse-card-dark,var(--pulse-card,#14171f));--pa-surface-0:var(--pulse-surface-0-dark,var(--pulse-surface-0,#0b0d12));--pa-surface-1:var(--pulse-surface-1-dark,var(--pulse-surface-1,#1b1f29));--pa-line:var(--pulse-line-dark,var(--pulse-line,#2a2f3b));--pa-line-control:var(--pulse-line-control-dark,var(--pulse-line-control,#5f6676));--pa-primary:var(--pulse-primary-dark,var(--pulse-primary,#80a7ff));--pa-primary-hover:var(--pulse-primary-hover-dark,var(--pulse-primary-hover,#93bbff));--pa-primary-tint:var(--pulse-primary-tint-dark,var(--pulse-primary-tint,#142140));--pa-primary-line:var(--pulse-primary-line-dark,var(--pulse-primary-line,#293349));--pa-signal:var(--pulse-signal-dark,var(--pulse-signal,#f84840));--pa-signal-text:var(--pulse-signal-text-dark,var(--pulse-signal-text,#ff6b63));--pa-signal-tint:var(--pulse-signal-tint-dark,var(--pulse-signal-tint,#2e1517));--pa-signal-line:var(--pulse-signal-line-dark,var(--pulse-signal-line,#5d2d2e));--pa-gap:var(--pulse-gap-dark,var(--pulse-gap,#ffb020));--pa-gap-fill:var(--pulse-gap-fill-dark,var(--pulse-gap-fill,#2e2410));--pa-gap-strong:var(--pulse-gap-strong-dark,var(--pulse-gap-strong,#ffb020));--pa-chart-main:var(--pulse-chart-main-dark,var(--pulse-chart-main,#80a7ff));--pa-chart-missing:var(--pulse-chart-missing-dark,var(--pulse-chart-missing,#ffb020));--pa-chart-baseline:var(--pulse-chart-baseline-dark,var(--pulse-chart-baseline,#868da3));--pa-baseline:var(--pulse-baseline-dark,var(--pulse-baseline,#868da3));--pa-success:var(--pulse-success-dark,var(--pulse-success,#4fd1a1));--pa-on-step:var(--pulse-on-step-dark,var(--pulse-on-step,#0b1b3a));--pa-sky:var(--pulse-sky-dark,var(--pulse-sky,#7db8f2));--pa-chart-second:var(--pulse-chart-second-dark,var(--pulse-chart-second,#b18cff));--pa-primary-wash:var(--p