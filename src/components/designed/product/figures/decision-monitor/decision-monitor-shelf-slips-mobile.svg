nt}}</style><foreignObject x="0" y="0" width="375" height="1155"><div xmlns="http://www.w3.org/1999/xhtml" style="width:375px;height:1155px;overflow:hidden" aria-hidden="true"><div class="dmsm-b0 dmsm0"> <div class="dmsm-b1 dmsm1"> <h2 class="dmsm-b2 dmsm2"> What does a shelf look like when it slips? </h2> <p class="dmsm-b3 dmsm3"> <span class="dmsm-b4 dmsm4"><span class="dmsm-tw"><span class="dmsm-tc4"><span>94</span><span>10</span><span>19</span><span>27</span><span>35</span><span>42</span><span>48</span><span>54</span><span>60</span><span>65</span><span>69</span><span>73</span><span>76</span><span>80</span><span>82</span><span>85</span><span>87</span><span>88</span><span>90</span><span>91</span><span>92</span><span>93</span><span>94</span></span></span></span> <span class="dmsm-b5 dmsm5">of 216 products a shopper still cannot tell apart, on the shelf we measured</span> </p> <h3 class="dmsm-b6 dmsm6"> Not every missing attribute is worth an alert </h3> <p class="dmsm-b7 dmsm7"> A completeness dashboard reports the same green number whether a shelf gained ten well-recorded products or ten blank ones. </p> <p class="dmsm-b8 dmsm7"> So the decay is invisible until a buyer complains, a filter returns nothing, or someone asks why a category stopped converting and nobody can name the week it changed. </p> <p class="dmsm-b9 dmsm8"> Monitor tells you the week that number moved, and which attribute moved it. </p> </div> <div class="dmsm-b10 dmsm1"> <div class="dmsm-b11 dmsm9"> <p class="dmsm-b12 dmsm6"> Requirements needing each attribute </p> <p class="dmsm-b13 dmsma"> Example data: the laptop shelf from the home page. </p> <ul class="dmsm-b14 dmsmb"> <li class="dmsm-b15 dmsmc"> <div class="dmsm-b16 dmsmd"> <span class="dmsm-b17 dmsme">Screen size</span> <span class="dmsm-b18 dmsmf">15 of 32</span> </div> <span class="dmsm-b19 dmsm10"><span class="dmsm-b20 dmsm11"></span></span> </li> <li class="dmsm-b21 dmsmc"> <div class="dmsm-b22 dmsmd"> <span class="dmsm-b23 dmsme">Processor</span> <span class="dmsm-b24 dmsmf">2 of 32</span> </div> <span class="dmsm-b25 dmsm10"><span class="dmsm-b26 dmsm12"></span></span> </li> </ul> </div> </div> <p class="dmsm-b27 dmsm13"> Note: Figures are hypothetical and for illustrative purposes only. </p> </div></div></foreignObject></svg>