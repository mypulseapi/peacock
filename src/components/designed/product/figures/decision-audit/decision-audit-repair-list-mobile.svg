<svg xmlns="http://www.w3.org/2000/svg" class="darm-root" viewBox="0 0 343 571" width="343" height="571" role="img" aria-labelledby="darm-t darm-d"><title id="darm-t">Your ranked repair list</title><desc id="darm-d">Example data, ranked by bits of decision information: 1 Screen size, 80 of 216 products missing it, 1.067 bits; 2 Memory, 60 of 216, 1.012 bits; 3 Processor, 162 of 216, 0.747 bits; 4 Storage, 55 of 216, 0.688 bits. Back within 48 hours.</desc><style>.darm-root{color-scheme:light dark;--pd:light-dark(var(--pulse-ink,#0b1b3a),var(--pulse-ink-dark,var(--pulse-ink,#eef0f5)));--pa:light-dark(var(--pulse-muted,#56607a),var(--pulse-muted-dark,var(--pulse-muted,#a3a9b8)));--pc:light-dark(var(--pulse-card,#ffffff),var(--pulse-card-dark,var(--pulse-card,#14171f)));--p5:light-dark(var(--pulse-surface-1,#eef0f7),var(--pulse-surface-1-dark,var(--pulse-surface-1,#1b1f29)));--pb:light-dark(var(--pulse-line,#e3e6ef),var(--pulse-line-dark,var(--pulse-line,#2a2f3b)));--p8:light-dark(var(--pulse-primary,#2552ff),var(--pulse-primary-dark,var(--pulse-primary,#80a7ff)));--p0:light-dark(var(--pulse-primary-hover,#1d43d9),var(--pulse-primary-hover-dark,var(--pulse-primary-hover,#93bbff)));--p1:light-dark(var(--pulse-primary-tint,#eaf2ff),var(--pulse-primary-tint-dark,var(--pulse-primary-tint,#142140)));--p9:light-dark(var(--pulse-signal,#f84840),var(--pulse-signal-dark,var(--pulse-signal,#f84840)));--p2:light-dark(var(--pulse-signal-tint,#ffeceb),var(--pulse-signal-tint-dark,var(--pulse-signal-tint,#2e1517)));--p3:light-dark(var(--pulse-gap-strong,#8f5b00),var(--pulse-gap-strong-dark,var(--pulse-gap-strong,#ffb020)));--p4:light-dark(var(--pulse-chart-main,#2552ff),var(--pulse-chart-main-dark,var(--pulse-chart-main,#80a7ff)));--p6:light-dark(var(--pulse-baseline,#868da3),var(--pulse-baseline-dark,var(--pulse-baseline,#868da3)));--p7:light-dark(var(--pulse-on-step,#0b1b3a),var(--pulse-on-step-dark,var(--pulse-on-step,#0b1b3a)))}:where(.dark,[data-theme=dark]) .darm-root{color-scheme:dark}:where(.light,[data-theme=light]) .darm-root{color-scheme:light}.darm-root text{font-family:var(--pulse-font-sans,var(--font-geist-sans,Geist,system-ui,sans-serif))}.darm-root text[font-family=M]{font-family:var(--pulse-font-mono,var(--font-geist-mono,'Geist Mono',ui-monospace,monospace))}.darm-root text{font-variant-numeric:tabular-nums}@keyframes darm-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes darm-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.darm-up{animation:darm-up .7s cubic-bezier(0.33,1,0.68,1) both}.darm-grow{animation:darm-grow 1.1s cubic-bezier(0.2,0,0,1) both;transform-box:fill-box;transform-origin:left center}.darm-foot{font-family:var(--pulse-font-sans,var(--font-geist-sans,Geist,system-ui,sans-serif)),system-ui,sans-serif;margin:0;font-size:12px;line-height:16px;color:var(--pa)}@media (prefers-reduced-motion: reduce){.darm-root *{animation:none!important}}.darm-root text:not([font-size]){font-size:18px}.darm-root text:not([font-weight]){font-weight:600}.darm-root text:not([letter-spacing]){letter-spacing:-0.006em}.darms0{fill:var(--pd)}.darms1{stroke:var(--p7)}.darms2{fill:var(--p8)}.darms3{stroke:var(--p3)}.darms4{fill:var(--p3)}.darms5{fill:var(--p5)}.darms6{fill:var(--p6)}</style><defs><g id="darm-i0" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g></defs><rect x="0.5" y="0.5" width="342" height="570" rx="16" style="fill:var(--pc);stroke:var(--pb)"/><text x="21" y="32" font-size="14"  class="darms0">Your ranked repair list</text><rect x="180.8" y="17.5" width="141.2" height="20" rx="10" style="fill:var(--p1)"/><text letter-spacing="0em" x="251.4" y="31.5" font-size="12" text-anchor="middle" style="fill:var(--p0)" >Back within 48 hours</text><g class="darm-up" style="animation-delay:0.15s"><rect x="14" y="51" width="315" height="106" rx="