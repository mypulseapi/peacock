<svg xmlns="http://www.w3.org/2000/svg" class="dah-root" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-labelledby="dah-t dah-d"><title id="dah-t">How does the audit work?</title><desc id="dah-d">You: Send one category. Provide a CSV or JSON file containing product names, descriptions, categories, prices, and existing attributes. Choose a category where shoppers struggle to find the right product. Us: We measure it. Within 48 hours, we measure how much each attribute helps tell products apart, and what it would be worth if recorded across the category, in bits rather than clicks. Both: We walk you through it. Receive a ranked list of attributes and supporting files. We walk you through the findings and discuss what it would take to act on them.</desc><style>.dah-root{--pa-ink:var(--pulse-ink,#0b1b3a);--pa-muted:var(--pulse-muted,#56607a);--pa-card:var(--pulse-card,#ffffff);--pa-surface-0:var(--pulse-surface-0,#f7f8fc);--pa-surface-1:var(--pulse-surface-1,#eef0f7);--pa-line:var(--pulse-line,#e3e6ef);--pa-line-control:var(--pulse-line-control,#868da3);--pa-primary:var(--pulse-primary,#2552ff);--pa-primary-hover:var(--pulse-primary-hover,#1d43d9);--pa-primary-tint:var(--pulse-primary-tint,#eaf2ff);--pa-primary-line:var(--pulse-primary-line,#cbddff);--pa-signal:var(--pulse-signal,#f84840);--pa-signal-text:var(--pulse-signal-text,#c8261f);--pa-signal-tint:var(--pulse-signal-tint,#ffeceb);--pa-signal-line:var(--pulse-signal-line,#ffc5bc);--pa-gap:var(--pulse-gap,#ffb020);--pa-gap-fill:var(--pulse-gap-fill,#ffefd2);--pa-gap-strong:var(--pulse-gap-strong,#8f5b00);--pa-chart-main:var(--pulse-chart-main,#2552ff);--pa-chart-missing:var(--pulse-chart-missing,#ffb020);--pa-chart-baseline:var(--pulse-chart-baseline,#868da3);--pa-baseline:var(--pulse-baseline,#868da3);--pa-success:var(--pulse-success,#0e7a55);--pa-on-step:var(--pulse-on-step,#0b1b3a);--pa-sky:var(--pulse-sky,#3990e2);--pa-chart-second:var(--pulse-chart-second,#893ff2);--pa-primary-wash:var(--puls