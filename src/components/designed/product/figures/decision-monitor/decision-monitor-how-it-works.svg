<svg xmlns="http://www.w3.org/2000/svg" class="dmh-root" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-labelledby="dmh-t dmh-d"><title id="dmh-t">Set it once, then hear about it when it matters</title><desc id="dmh-d">Once: Set the cadence. Weekly or monthly, matched to how often your catalogue changes. It reads the same export the audit read, so there is nothing new to build and no integration to maintain. Ongoing: Monitor re-measures. The same method on every run, so the numbers are comparable over time rather than a series of unrelated snapshots. When it matters: You get told, with the reason. Not a dashboard you have to remember to open. An alert naming the shelf, the attribute and what caused the drop.</desc><style>.dmh-root{--pa-ink:var(--pulse-ink,#0b1b3a);--pa-muted:var(--pulse-muted,#56607a);--pa-card:var(--pulse-card,#ffffff);--pa-surface-0:var(--pulse-surface-0,#f7f8fc);--pa-surface-1:var(--pulse-surface-1,#eef0f7);--pa-line:var(--pulse-line,#e3e6ef);--pa-line-control:var(--pulse-line-control,#868da3);--pa-primary:var(--pulse-primary,#2552ff);--pa-primary-hover:var(--pulse-primary-hover,#1d43d9);--pa-primary-tint:var(--pulse-primary-tint,#eaf2ff);--pa-primary-line:var(--pulse-primary-line,#cbddff);--pa-signal:var(--pulse-signal,#f84840);--pa-signal-text:var(--pulse-signal-text,#c8261f);--pa-signal-tint:var(--pulse-signal-tint,#ffeceb);--pa-signal-line:var(--pulse-signal-line,#ffc5bc);--pa-gap:var(--pulse-gap,#ffb020);--pa-gap-fill:var(--pulse-gap-fill,#ffefd2);--pa-gap-strong:var(--pulse-gap-strong,#8f5b00);--pa-chart-main:var(--pulse-chart-main,#2552ff);--pa-chart-missing:var(--pulse-chart-missing,#ffb020);--pa-chart-baseline:var(--pulse-chart-baseline,#868da3);--pa-baseline:var(--pulse-baseline,#868da3);--pa-success:var(--pulse-success,#0e7a55);--pa-on-step:var(--pulse-on-step,#0b1b3a);--pa-sky:var(--pulse-sky,#3990e2);--pa-chart-second:var(--pulse-chart-second,#893ff2);--pa-primary-wash:var(--pulse-primary-wash,#f1f6ff)}@media (prefers-color-scheme: dark){.dmh-root{--pa-ink:var(--pulse-ink-dark,var(--pulse-ink,#eef0f5));--pa-muted:var(--pulse-muted-dark,var(--pulse-muted,#a3a9b8));--pa-card:var(--pulse-card-dark,var(--pulse-card,#14171f));--pa-surface-0:var(--pulse-surface-0-dark,var(--pulse-surface-0,#0b0d12));--pa-surface-1:var(--pulse-surface-1-dark,var(--pulse-surface-1,#1b1f29));--pa-line:var(--pulse-line-dark,var(--pulse-line,#2a2f3b));--pa-line-control:var(--pulse-line-control-dark,var(--pulse-line-control,#5f6676));--pa-primary:var(--pulse-primary-dark,var(--pulse-primary,#80a7ff));--pa-primary-hover:var(--pulse-primary-hover-dark,var(--pulse-primary-hover,#93bbff));--pa-primary-tint:var(--pulse-primary-tint-dark,var(--pulse-primary-tint,#142140));--pa-primary-line:var(--pulse-primary-line-dark,var(--pulse-primary-line,#293349));--pa-signal:var(--pulse-signal-dark,var(--pulse-signal,#f84840));--pa-signal-text:var(--pulse-signal-text-dark,var(--pulse-signal-text,#ff6b63));--pa-signal-tint:var(--pulse-signal-tint-dark,var(--pulse-signal-tint,#2e1517));--pa-signal-line:var(--pulse-signal-line-dark,var(--pulse-signal-line,#5d2d2e));--pa-gap:var(--pulse-gap-dark,var(--pulse-gap,#ffb020));--pa-gap-fill:var(--pulse-gap-fill-dark,var(--pulse-gap-fill,#2e2410));--pa-gap-strong:var(--pulse-gap-strong-dark,var(--pulse-gap-strong,#ffb020));--pa-chart-main:var(--pulse-chart-main-dark,var(--pulse-chart-main,#80a7ff));--pa-chart-missing:var(--pulse-chart-missing-dark,var(--pulse-chart-missing,#ffb020));--pa-chart-baseline:var(--pulse-chart-baseline-dark,var(--pulse-chart-baseline,#868da3));--pa-baseline:var(--pulse-baseline-dark,var(--pulse-baseline,#868da3));--pa-success:var(--pulse-success-dark,var(--pulse-success,#4fd1a1));--pa-on-step:var(--pulse-on-step-dark,var(--pulse-on-step,#0b1b3a));--pa-sky:var(--pulse-sky-dark,var(--pulse-sky,#7db8f2));--pa-chart-second:var(--pulse-chart-second-dark,var(--pulse-chart-second,#b18cff));--pa-primary-wash:var(--pulse-primary-wash-dark,var(--pulse-primary-wash,#1a1e2a))}}:where(.dark,[data-theme=dark]) .dmh-root{--pa-ink:var(--pulse-ink-dark,var(--pulse-ink,#eef0f5));--pa-muted:var(--pulse-muted-dark,var(--pulse-muted,#a3a9b8));--pa-card:var(--pulse-card-dark,var(--pulse-card,#14171f));--pa-surface-0:var(--pulse-surface-0-dark,var(--pulse-surface-0,#0b0d12));--pa-surface-1:var(--pulse-surface-1-dark,var(--pulse-surface-1,#1b1f29));--pa-line:var(--pulse-line-dark,var(--pulse-line,#2a2f3b));--pa-line-control:var(--pulse-line-control-dark,var(--pulse-line-control,#5f6676));--pa-primary:var(--pulse-primary-dark,var(--pulse-primary,#80a7ff));--pa-primary-hover:var(--pulse-primary-hover-dark,var(--pulse-primary-hover,#93bbff));--pa-primary-tint:var(--pulse-primary-tint-dark,var(--pulse-primary-tint,#142140));--pa-primary-line:var(--pulse-primary-line-dark,var(--pulse-primary-line,#293349));--pa-signal:var(--pulse-signal-dark,var(--pulse-signal,#f84840));--pa-signal-text:var(--pulse-signal-text-dark,var(--pulse-signal-text,#ff6b63));--pa-signal-tint:var(--pulse-signal-tint-dark,var(--pulse-signal-tint,#2e1517));--pa-signal-line:var(--pulse-signal-line-dark,var(--pulse-signal-line,#5d2d2e));--pa-gap:var(--pulse-gap-dark,var(--pulse-gap,#ffb020));--pa-gap-fill:var(--pulse-gap-fill-dark,var(--pulse-gap-fill,#2e2410));--pa-gap-strong:var(--pulse-gap-strong-dark,var(--pulse-gap-strong,#ffb020));--pa-chart-main:var(--pulse-chart-main-dark,var(--pulse-chart-main,#80a7ff));--pa-chart-missing:var(--pulse-chart-missing-dark,var(--pulse-chart-missing,#ffb020));--pa-chart-baseline:var(--pulse-chart-baseline-dark,var(--pulse-chart-baseline,#868da3));--pa-baseline:var(--pulse-baseline-dark,var(--pulse-baseline,#868da3));--pa-success:var(--pulse-success-dark,var(--pulse-success,#4fd1a1));--pa-on-step:var(--pulse-on-step-dark,var(--pulse-on-step,#0b1b3a));--pa-sky:var(--pulse-sky-dark,var(--pulse-sky,#7db8f2));--pa-chart-second:var(--pulse-chart-second-dark,var(--pulse-chart-second,#b18cff));--pa-primary-wash:var(--pulse-primary-wash-dark,var(--pulse-primary-wash,#1a1e2a))}:where(.light,[data-theme=light]) .dmh-root{--pa-ink:var(--pulse-ink,#0b1b3a);--pa-muted:var(--pulse-muted,#56607a);--pa-card:var(--pulse-card,#ffffff);--pa-surface-0:var(--pulse-surface-0,#f7f8fc);--pa-surface-1:var(--pulse-surface-1,#eef0f7);--pa-line:var(--pulse-line,#e3e6ef);--pa-line-control:var(--pulse-line-control,#868da3);--pa-primary:var(--pulse-primary,#2552ff);--pa-primary-hover:var(--pulse-primary-hover,#1d43d9);--pa-primary-tint:var(--pulse-primary-tint,#eaf2ff);--pa-primary-line:var(--pulse-primary-line,#cbddff);--pa-signal:var(--pulse-signal,#f84840);--pa-signal-text:var(--pulse-signal-text,#c8261f);--pa-signal-tint:var(--pulse-signal-tint,#ffeceb);--pa-signal-line:var(--pulse-signal-line,#ffc5bc);--pa-gap:var(--pulse-gap,#ffb020);--pa-gap-fill:var(--pulse-gap-fill,#ffefd2);--pa-gap-strong:var(--pulse-gap-strong,#8f5b00);--pa-chart-main:var(--pulse-chart-main,#2552ff);--pa-chart-missing:var(--pulse-chart-missing,#ffb020);--pa-chart-baseline:var(--pulse-chart-baseline,#868da3);--pa-baseline:var(--pulse-baseline,#868da3);--pa-success:var(--pulse-success,#0e7a55);--pa-on-step:var(--pulse-on-step,#0b1b3a);--pa-sky:var(--pulse-sky,#3990e2);--pa-chart-second:var(--pulse-chart-second,#893ff2);--pa-primary-wash:var(--pulse-primary-wash,#f1f6ff)}.dmh-root text{font-variant-numeric:tabular-nums;font-kerning:normal}@keyframes dmh-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes dmh-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes dmh-on{from{opacity:0}to{opacity:1}}.dmh-up{animation:dmh-up .7s cubic-bezier(0.33,1,0.68,1) both}.dmh-grow{animation:dmh-grow 1.1s cubic-bezier(0.2,0,0,1) both;transform-box:fill-box;transform-origin:left center}.dmh-lab{font-family:'Geist', 'Geist Fallback', system-ui, sans-serif;margin:0;text-wrap:pretty;font-size:14px;line-height:21px;font-weight:600;color:var(--pa-primary)}.dmh-ttl{font-family:'Geist', 'Geist Fallback', system-ui, sans-serif;margin:0;text-wrap:pretty;font-size:18px;line-height:24px;font-weight:550;letter-spacing:-0.01em;color:var(--pa-ink)}.dmh-bod{font-family:'Geist', 'Geist Fallback', system-ui, sans-serif;margin:0;text-wrap:pretty;font-size:16px;line-height:26px;letter-spacing:-0.011em;color:var(--pa-muted)}@media (prefers-reduced-motion: reduce){.dmh-root *{animation:none!important}}</style><defs><linearGradient id="dmh-calm" x1="0" x2="1"><stop offset="0" style="stop-color:var(--pa-sky)"/><stop offset="1" style="stop-color:var(--pa-primary)"/></linearGradient></defs><rect x="0" y="8" width="1120" height="4" rx="2" style="fill:var(--pa-surface-1)"/><rect class="dmh-grow" x="0" y="8" width="1120" height="4" rx="2" fill="url(#dmh-calm)" style="animation-delay:.15s"/><g class="dmh-up" style="animation-delay:0.15s"><circle cx="10.0" cy="10" r="10" style="fill:var(--pa-primary-line)"/><circle cx="10.0" cy="10" r="9" style="fill:var(--pa-card)"/><circle cx="10.0" cy="10" r="5" style="fill:var(--pa-primary)"/><!-- EDIT step-1 --><foreignObject x="0.00" y="44.00" width="346.67" height="256.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="step-1"><p class="dmh-lab" data-edit="step-1-label">Once</p><p class="dmh-ttl" style="margin-top:13px" data-edit="step-1-title">Set the cadence</p><p class="dmh-bod" style="margin-top:6px" data-edit="step-1-body">Weekly or monthly, matched to how often your catalogue changes. It reads the same export the audit read, so there is nothing new to build and no integration to maintain.</p></div></foreignObject></g><g class="dmh-up" style="animation-delay:0.5s"><circle cx="396.6666666666667" cy="10" r="10" style="fill:var(--pa-primary-line)"/><circle cx="396.6666666666667" cy="10" r="9" style="fill:var(--pa-card)"/><circle cx="396.6666666666667" cy="10" r="5" style="fill:var(--pa-primary)"/><!-- EDIT step-2 --><foreignObject x="386.67" y="44.00" width="346.67" height="256.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="step-2"><p class="dmh-lab" data-edit="step-2-label">Ongoing</p><p class="dmh-ttl" style="margin-top:13px" data-edit="step-2-title">Monitor re-measures</p><p class="dmh-bod" style="margin-top:6px" data-edit="step-2-body">The same method on every run, so the numbers are comparable over time rather than a series of unrelated snapshots.</p></div></foreignObject></g><g class="dmh-up" style="animation-delay:0.85s"><circle cx="783.3333333333334" cy="10" r="10" style="fill:var(--pa-primary-line)"/><circle cx="783.3333333333334" cy="10" r="9" style="fill:var(--pa-card)"/><circle cx="783.3333333333334" cy="10" r="5" style="fill:var(--pa-primary)"/><!-- EDIT step-3 --><foreignObject x="773.33" y="44.00" width="346.67" height="256.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="step-3"><p class="dmh-lab" data-edit="step-3-label">When it matters</p><p class="dmh-ttl" style="margin-top:13px" data-edit="step-3-title">You get told, with the reason</p><p class="dmh-bod" style="margin-top:6px" data-edit="step-3-body">Not a dashboard you have to remember to open. An alert naming the shelf, the attribute and what caused the drop.</p></div></foreignObject></g></svg>