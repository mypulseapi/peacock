<svg xmlns="http://www.w3.org/2000/svg" class="dmx-root" viewBox="0 0 1120 386" width="1120" height="386" role="img" aria-labelledby="dmx-t dmx-d"><title id="dmx-t">What your business gains from Decision Monitor</title><desc id="dmx-d">Catch decay before a buyer does. See a shelf slipping while it is still a backlog item, rather than after it has become a project. Know the cause, not just the number. Every alert names the shelf, the attribute and what caused the drop, so the fix is obvious before anyone opens a dashboard. Compare quarters, not snapshots. The same method on every run, so the trend per category means something and a regression is visible as a regression.</desc><style>.dmx-root{--pa-ink:var(--pulse-ink,#0b1b3a);--pa-muted:var(--pulse-muted,#56607a);--pa-card:var(--pulse-card,#ffffff);--pa-surface-0:var(--pulse-surface-0,#f7f8fc);--pa-surface-1:var(--pulse-surface-1,#eef0f7);--pa-line:var(--pulse-line,#e3e6ef);--pa-line-control:var(--pulse-line-control,#868da3);--pa-primary:var(--pulse-primary,#2552ff);--pa-primary-hover:var(--pulse-primary-hover,#1d43d9);--pa-primary-tint:var(--pulse-primary-tint,#eaf2ff);--pa-primary-line:var(--pulse-primary-line,#cbddff);--pa-signal:var(--pulse-signal,#f84840);--pa-signal-text:var(--pulse-signal-text,#c8261f);--pa-signal-tint:var(--pulse-signal-tint,#ffeceb);--pa-signal-line:var(--pulse-signal-line,#ffc5bc);--pa-gap:var(--pulse-gap,#ffb020);--pa-gap-fill:var(--pulse-gap-fill,#ffefd2);--pa-gap-strong:var(--pulse-gap-strong,#8f5b00);--pa-chart-main:var(--pulse-chart-main,#2552ff);--pa-chart-missing:var(--pulse-chart-missing,#ffb020);--pa-chart-baseline:var(--pulse-chart-baseline,#868da3);--pa-baseline:var(--pulse-baseline,#868da3);--pa-success:var(--pulse-success,#0e7a55);--pa-on-step:var(--pulse-on-step,#0b1b3a);--pa-sky:var(--pulse-sky,#3990e2);--pa-chart-second:var(--pulse-chart-second,#893ff2);--pa-primary-wash:var(--pulse-primary-wash,#f1f6ff)}@media (prefers-color-scheme: dark){.dmx-root{--pa-ink:var(--pulse-ink-