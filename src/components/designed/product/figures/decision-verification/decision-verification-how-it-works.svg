tem-ui, sans-serif;margin:0;text-wrap:pretty;font-size:18px;line-height:24px;font-weight:550;letter-spacing:-0.01em;color:var(--pa-ink)}.dvh-bod{font-family:'Geist', 'Geist Fallback', system-ui, sans-serif;margin:0;text-wrap:pretty;font-size:16px;line-height:26px;letter-spacing:-0.011em;color:var(--pa-muted)}@media (prefers-reduced-motion: reduce){.dvh-root *{animation:none!important}}</style><defs><linearGradient id="dvh-calm" x1="0" x2="1"><stop offset="0" style="stop-color:var(--pa-sky)"/><stop offset="1" style="stop-color:var(--pa-primary)"/></linearGradient></defs><rect x="0" y="8" width="1120" height="4" rx="2" style="fill:var(--pa-surface-1)"/><rect class="dvh-grow" x="0" y="8" width="1120" height="4" rx="2" fill="url(#dvh-calm)" style="animation-delay:.15s"/><g class="dvh-up" style="animation-delay:0.15s"><circle cx="10.0" cy="10" r="10" style="fill:var(--pa-primary-line)"/><circle cx="10.0" cy="10" r="9" style="fill:var(--pa-card)"/><circle cx="10.0" cy="10" r="5" style="fill:var(--pa-primary)"/><!-- EDIT step-1 --><foreignObject x="0.00" y="44.00" width="346.67" height="286.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="step-1"><p class="dvh-lab" data-edit="step-1-label">You</p><p class="dvh-ttl" style="margin-top:13px" data-edit="step-1-title">Re-export the category</p><p class="dvh-bod" style="margin-top:6px" data-edit="step-1-body">Export your shelf with current progress. Partial data is saved and supported, no need to wait for a full completion.</p></div></foreignObject></g><g class="dvh-up" style="animation-delay:0.5s"><circle cx="396.6666666666667" cy="10" r="10" style="fill:var(--pa-primary-line)"/><circle cx="396.6666666666667" cy="10" r="9" style="fill:var(--pa-card)"/><circle cx="396.6666666666667" cy="10" r="5" style="fill:var(--pa-primary)"/><!-- EDIT step-2 --><foreignObject x="386.67" y="44.00" width="346.67" height="286.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="step-2"><p class="dvh-lab" data-edit="step-2-label">Us</p><p class="dvh-ttl" style="margin-top:13px" data-edit="step-2-title">Comparable before &amp; after results</p><p class="dvh-bod" style="margin-top:6px" data-edit="step-2-body">We use the same method and product attributes in both audits, ensuring accurate and reliable before-and-after comparisons without changing the evaluation criteria.</p></div></foreignObject></g><g class="dvh-up" style="animation-delay:0.85s"><circle cx="783.3333333333334" cy="10" r="10" style="fill:var(--pa-primary-line)"/><circle cx="783.3333333333334" cy="10" r="9" style="fill:var(--pa-card)"/><circle cx="783.3333333333334" cy="10" r="5" style="fill:var(--pa-primary)"/><!-- EDIT step-3 --><foreignObject x="773.33" y="44.00" width="346.67" height="286.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="step-3"><p class="dvh-lab" data-edit="step-3-label">Both</p><p class="dvh-ttl" style="margin-top:13px" data-edit="step-3-title">See what has improved</p><p class="dvh-bod" style="margin-top:6px" data-edit="step-3-body">Track product attribute coverage, measure catalogue gap improvements, and assess your readiness score in a clear, shareable report for business decision-makers.</p></div></foreignObject></g></svg>