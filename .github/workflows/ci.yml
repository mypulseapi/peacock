# Checks whose job names are what the branch rulesets require. A required status check naming a
# job that does not exist blocks every pull request forever, so the `name:` of each job here and
# the ruleset's context strings are one contract.
#
# `Lint` and `Type check` are required on develop and main; `Build site` and `Source branch` on
# main. The deploy workflow (static.yml) runs only on a push to main. This one never deploys.
name: CI

on:
  # Every pull request, whatever its base: the develop ruleset needs these contexts too, and a PR
  # into develop that cannot report them would never be mergeable.
  #
  # `edited` matters: changing a pull request's base branch has to re-run Source branch, or a PR
  # opened against develop and then retargeted at main keeps the pass it earned under the old base.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

# A new push to a pull request makes the previous run's answer irrelevant. Runs on develop and main
# always finish, because those are the ones a release is judged on.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `main` is the deploy. Letting a feature branch merge straight into it would publish work
      # that never sat on develop, which is the whole point of having develop.
      - name: Only develop may be merged into main
        if: github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Pull requests into main must come from develop. Open this one against develop instead."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # No `pnpm format:check` yet. This app arrived from the monorepo, where it was never
      # Prettier-formatted, so the check fails on 161 files that this change does not touch.
      # Running --write here would bury the migration in a reformat nobody can review. The
      # reformat is worth doing as its own commit, on a quiet branch, and the gate goes in with it.

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        # The same origins the deploy uses. A build with one missing fails by design, so this job
        # also proves the deploy's environment is complete before the merge rather than after it.
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://thepulseapi.com' }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.NEXT_PUBLIC_DOCS_URL || 'https://developer.thepulseapi.com' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.thepulseapi.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.thepulseapi.com' }}
          NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL || 'https://cdn.thepulseapi.com' }}
          NEXT_PUBLIC_DEMO_URL: ${{ vars.NEXT_PUBLIC_DEMO_URL || 'https://demo.thepulseapi.com' }}
          NEXT_PUBLIC_AUTH_URL: ${{ vars.NEXT_PUBLIC_AUTH_URL || 'https://api.thepulseapi.com' }}
          NEXT_PUBLIC_CDN_PREFIX: ${{ vars.NEXT_PUBLIC_CDN_PREFIX || 'website' }}
          NEXT_PUBLIC_SDK_PATH: ${{ vars.NEXT_PUBLIC_SDK_PATH || '/sdk/v0/pulse.iife.js' }}
          NEXT_PUBLIC_API_BASE_PATH: ${{ vars.NEXT_PUBLIC_API_BASE_PATH || '/api/v1' }}
          NEXT_PUBLIC_APP_SIGNIN_PATH: ${{ vars.NEXT_PUBLIC_APP_SIGNIN_PATH || '/signin' }}
          NEXT_PUBLIC_APP_SIGNUP_PATH: ${{ vars.NEXT_PUBLIC_APP_SIGNUP_PATH || '/register' }}
          NEXT_PUBLIC_APP_API_KEY_PATH: ${{ vars.NEXT_PUBLIC_APP_API_KEY_PATH || '/settings/api' }}
          NEXT_PUBLIC_GOOGLE_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_ENABLED || 'false' }}
        run: pnpm build

      - name: SEO and AEO gates
        # Reads the exported HTML, because every rule in the standard is about what a crawler
        # receives rather than what the source intended. See scripts/check-seo.mjs.
        run: node scripts/check-seo.mjs
