-size:16px;line-height:26px;letter-spacing:-0.011em;color:var(--pa-muted);text-align:center}@media (prefers-reduced-motion: reduce){.dmx-root *{animation:none!important}}</style><defs><radialGradient id="dmx-fade" cx="0.5" cy="0.5" r="0.5"><stop offset="0.25" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="dmx-gridmask" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#dmx-fade)"/></mask></defs><g class="dmx-up" style="animation-delay:0.10s"><rect x="0.50" y="0.5" width="357.67" height="385" rx="16" style="fill:var(--pa-card);stroke:var(--pa-line)"/><g mask="url(#dmx-gridmask)" style="stroke:var(--pa-line)" fill="none" stroke-width="1"><rect x="59.33500000000001" y="24" width="240" height="240" fill="none" stroke="none"/><path d="M59.33500000000001 24v240M59.33500000000001 24h240"/><path d="M107.33500000000001 24v240M59.33500000000001 72h240"/><path d="M155.335 24v240M59.33500000000001 120h240"/><path d="M203.335 24v240M59.33500000000001 168h240"/><path d="M251.335 24v240M59.33500000000001 216h240"/><path d="M299.33500000000004 24v240M59.33500000000001 264h240"/></g><g transform="translate(165.34,130.00) scale(1.1667)" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--pa-ink)"><circle cx="12" cy="8" r="5"/> <path d="M20 21a8 8 0 0 0-16 0"/></g><!-- EDIT card-1 --><foreignObject x="24.00" y="236.00" width="310.67" height="134.00"><div xmlns="http://www.w3.org/1999/xhtml" data-edit="card-1"><p class="dmx-ttl" data-edit="card-1-title">Catch decay before a buyer does</p><p class="dmx-bod" style="margin-top:12px" data-edit="card-1-body">See a shelf slipping while it is still a backlog item, rather than after it has become a project.</p></div></foreignObject></g><g class="dmx-up" style="animation-delay:0.22s"><rect x="381.17" y="0.5" width="357.67" height="385" rx="16" style="fill:var(--pa-card);stroke:var(--pa-line)"/><g mask="url(#dmx-gridmask)" s